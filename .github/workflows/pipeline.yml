name: Check README

on: [push]

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Get the code
      - name: Download my code
        uses: actions/checkout@v3
      
      # Step 2: Check if README exists
      - name: Look for README
        run: |
          if [ -f "README.md" ]; then
            echo "✅ README.md exists!"
          else
            echo "❌ No README.md found"
          fi
